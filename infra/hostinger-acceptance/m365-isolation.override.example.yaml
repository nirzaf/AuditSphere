# Operator-reviewed example; never included automatically.
# Requires Docker Compose >= 2.24.4 for !override.
# Copy/include only after adapting paths and reviewing the final merged model.
# Compatibility example for older source revisions with the broad API parent mount.
# Current base compose.yaml already uses these individual capability mounts.
# The privileged client-sites key is intentionally excluded.
services:
  api:
    volumes: !override
      - data_protection:/app/data-protection-home
      - pbc_staging:/var/lib/auditsphere/pbc-staging
      - release_checkpoints:/var/lib/auditsphere/release-checkpoints
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/directory-reader
        target: /run/auditsphere/m365/directory-reader
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/selected-site
        target: /run/auditsphere/m365/selected-site
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/provisioning
        target: /run/auditsphere/m365/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/guest-invitation
        target: /run/auditsphere/m365/guest-invitation
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/group-membership
        target: /run/auditsphere/m365/group-membership
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/auditsphere/storage/m365-credentials/outbound-mail
        target: /run/auditsphere/m365/outbound-mail
        read_only: true
        bind:
          create_host_path: false
