name: AuditSphereOps CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auditsphere-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_ENVIRONMENT: Test
  ASPNETCORE_ENVIRONMENT: Test
  ExternalEffects__Enabled: 'false'
  Application__AllowSimulationAdapters: 'true'
  DevelopmentIdentity__Enabled: 'false'

jobs:
  # Angular presentation gate: production build, then the Vitest specs. Runs in parallel with the
  # .NET gate; its browser bundle is handed to the API publish verification through a build
  # artifact (the Api publish target globs ../AuditSphereOps.Ui/dist/auditsphere-ui/browser).
  ui-build:
    name: Build · Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: src/AuditSphereOps.Ui/.nvmrc
          cache: npm
          cache-dependency-path: src/AuditSphereOps.Ui/package-lock.json

      - name: Build and test Angular presentation
        working-directory: src/AuditSphereOps.Ui
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:ci

      - name: Upload Angular browser bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser
          retention-days: 1

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Angular gate outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  # Mandatory gate: pinned-SDK locked restore, Release build, focused PostgreSQL-backed workflow
  # regressions, EF model drift, and standalone API + Angular publication verification. The OpenAPI
  # drift check below runs the real API host through tools/AuditSphereOps.OpenApiEmitter.
  dotnet-build:
    needs: ui-build
    name: Build · .NET Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: auditsphere_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditsphere_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify pinned .NET SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          sdk = json.loads(Path('global.json').read_text())['sdk']
          assert sdk.get('rollForward') == 'disable', 'Locked restore requires an exact SDK pin'
          actual = subprocess.check_output(['dotnet', '--version'], text=True).strip()
          assert actual == sdk['version'], f"Expected SDK {sdk['version']}, selected {actual}"
          print(f'Verified pinned .NET SDK {actual}')
          PY

      - name: Restore and build Release
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore AuditSphereOps.slnx --locked-mode
          # Serialize to a single MSBuild node: Web and the test projects ProjectReference
          # the Api, so the default parallel solution build races on the Api's output files
          # (runtimeconfig.json and Roslyn satellite DLLs), causing intermittent MSB3026/MSB4018
          # "used by another process" failures.
          dotnet build AuditSphereOps.slnx --no-restore --configuration Release --maxcpucount:1

      - name: Run focused workflow PostgreSQL and route regressions
        env:
          AUDITSPHERE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=auditsphere_tests;Username=postgres;Password=postgres;Pooling=false
        run: |
          set -euo pipefail
          dotnet test tests/AuditSphereOps.Domain.Tests/AuditSphereOps.Domain.Tests.csproj --no-build --no-restore \
            --configuration Release --maxcpucount:1 \
            --filter 'FullyQualifiedName~RecurringEngagementRiskTests|FullyQualifiedName~EngagementActivationReviewTests|FullyQualifiedName~EngagementActivationAdvanceGateTests|FullyQualifiedName~EngagementLifecycleQueryTests|FullyQualifiedName~CommercialWorkflowTests|FullyQualifiedName~EngagementPeriodOverlapTests|FullyQualifiedName~EngagementCreationSafetyTests|FullyQualifiedName~EngagementCreationReviewTests|FullyQualifiedName~FirmOperationsTests.Analytics_|FullyQualifiedName~EngagementWorkflowTaskTests|FullyQualifiedName~WorkflowTemplateTests|FullyQualifiedName~EngagementWorkflowPlanTests|FullyQualifiedName~DueDateRevisionIsManagerScopedAndRecordedWithExactBeforeAndAfterValues|FullyQualifiedName~ChangesRequiredReviewCreatesOneLinkedOperationalReworkTaskWithoutChangingReviewAuthority|FullyQualifiedName~PriorPeriodAcceptedOfferDoesNotAdvanceANewPeriodEngagement'
          dotnet test tests/AuditSphereOps.Api.Tests/AuditSphereOps.Api.Tests.csproj --no-build --no-restore \
            --configuration Release --maxcpucount:1 \
            --filter 'FullyQualifiedName~AngularRoutingContractTests.ApiDeepLinks_ExactlyMatchTheAngularRouteCatalogue'

      - name: Check EF model drift
        run: |
          set -euo pipefail
          dotnet ef migrations has-pending-model-changes --project src/AuditSphereOps.Infrastructure \
            --startup-project src/AuditSphereOps.Api --no-build --configuration Release

      - name: Download Angular browser bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser

      - name: Verify workflow coordination through the real API and browser
        env:
          AUDITSPHERE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=auditsphere_tests;Username=postgres;Password=postgres;Pooling=false
          E2E_BROWSER: chromium
        run: |
          set -euo pipefail
          pwsh tests/AuditSphereOps.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          dotnet test tests/AuditSphereOps.E2E.Tests/AuditSphereOps.E2E.Tests.csproj --no-build --no-restore \
            --configuration Release --maxcpucount:1 --filter 'FullyQualifiedName~AngularAnalyticsPagingJourneyTests|FullyQualifiedName~AngularEngagementCreationJourneyTests|FullyQualifiedName~AngularEngagementActivationJourneyTests'

      - name: Verify standalone API and Angular publication
        run: |
          set -euo pipefail
          dotnet publish src/AuditSphereOps.Api --no-build --no-restore --configuration Release \
            --output "$RUNNER_TEMP/auditsphere-api"
          test -f "$RUNNER_TEMP/auditsphere-api/AuditSphereOps.Api.dll"
          test -f "$RUNNER_TEMP/auditsphere-api/ui/index.html"
          test ! -f "$RUNNER_TEMP/auditsphere-api/AuditSphereOps.Web.dll"
          test ! -f "$RUNNER_TEMP/auditsphere-api/MudBlazor.dll"

      # Contract drift gate: regenerate the canonical OpenAPI 3.1 document in-memory (no
      # database needed) and fail when the committed artifact is stale. Not a hosted test
      # suite: a single in-process generation check, consistent with the build-gate policy.
      - name: Verify OpenAPI contract drift
        run: bash scripts/contracts/verify-openapi.sh

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '.NET gate outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  # Documentation health gate: canonical-link integrity, naming policy and
  # HISTORICAL_SOURCE banners. Pure stdlib Python; no .NET or database needed.
  docs-health:
    name: Docs · Health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Markdown documentation health
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-markdown-documentation.py

      - name: Validate capability packets and runner safety guards
        run: |
          set -euo pipefail
          python3 scripts/agent/agent-check.py --validate-catalog
          python3 -m unittest discover -s scripts/agent -p 'test_*.py'

      - name: Check UI source discovery drift
        run: python3 scripts/ui/inventory.py --check

      - name: Validate Markdown filenames
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-markdown-filenames.py

      - name: Validate narrative documents for volatile metrics
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-narrative-metrics.py

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Docs health outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
