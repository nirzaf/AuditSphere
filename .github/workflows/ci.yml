name: AuditSphereOps CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-ready:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: auditsphere_tests
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d auditsphere_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AUDITSPHERE_TEST_CONNECTION: Host=127.0.0.1;Port=5433;Database=auditsphere_tests;Username=postgres
      ConnectionStrings__AuditSphere: Host=127.0.0.1;Port=5433;Database=auditsphere_tests;Username=postgres
      AUDITSPHERE_EF_CONNECTION: Host=127.0.0.1;Port=5433;Database=auditsphere_tests;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore AuditSphereOps.slnx
      - run: dotnet build AuditSphereOps.slnx --no-restore
      - run: dotnet ef database update --project src/AuditSphereOps.Infrastructure --startup-project src/AuditSphereOps.Web --no-build
      - run: dotnet test AuditSphereOps.slnx --no-build
      - name: Verify readiness requires a current schema
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/AuditSphereOps.Web --no-build --urls http://127.0.0.1:5099 > web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5099/health/ready > readiness.txt; then
              grep -q 'Healthy' readiness.txt
              exit 0
            fi
            sleep 1
          done
          cat web.log
          cat readiness.txt || true
          exit 1
