name: AuditSphereOps CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Manual verification retains its dispatched SHA while new pushes replace push runs.
  group: auditsphere-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_ENVIRONMENT: Test
  ASPNETCORE_ENVIRONMENT: Test
  ExternalEffects__Enabled: 'false'
  Application__AllowSimulationAdapters: 'true'
  DevelopmentIdentity__Enabled: 'false'

jobs:
  # The only fast-path exemption is content-only docs Markdown or the execution status ledger.
  # Pull requests, manual dispatches, empty diffs, unknown paths, and diff failures take the
  # normal application gate.
  # Docs health remains mandatory on every event; application builds are skipped only when the
  # classifier proves every changed path is documentation content.
  change-scope:
    name: Classify · Documentation-only changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_build: ${{ steps.classify.outputs.full_build }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Classify changed paths (fail closed to full application checks)
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/release/ci_change_scope.py

  # Angular presentation gate: production build, then the Vitest specs. Runs before the
  # .NET publication gate; its browser bundle is handed to the API publish verification through a build
  # artifact (the Api publish target globs ../AuditSphereOps.Ui/dist/auditsphere-ui/browser).
  ui-build:
    needs: [change-scope]
    if: ${{ always() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.full_build != 'false') }}
    name: Build · Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: src/AuditSphereOps.Ui/.nvmrc
          cache: npm
          cache-dependency-path: src/AuditSphereOps.Ui/package-lock.json

      - name: Build and test Angular presentation
        working-directory: src/AuditSphereOps.Ui
        run: |
          set -euo pipefail
          npm ci
          npm run lint:ci
          npm run build
          npm run test:ci

      - name: Upload Angular browser bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser
          # The release workflow can reuse this small exact-source bundle after its approval
          # and full-regression gates. Keep it available through normal release scheduling.
          retention-days: 7

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Angular gate outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  # Compile independently of Angular on master pushes and manual master CI runs. The checked
  # Release outputs are passed to the fast gate and can later be reused by exact-source full
  # verification. Other events retain the clean build path in dotnet-build. This overlaps the
  # long solution build with Angular without moving any checks or weakening full verification.
  dotnet-release-compile:
    needs: [change-scope]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && (needs.change-scope.result != 'success' || needs.change-scope.outputs.full_build != 'false') }}
    name: Build · .NET Release outputs
    runs-on: ubuntu-24.04
    # Leave time for checkout, restore and artifact upload after the cold .NET 11 build.
    # The previous 60-minute job deadline interrupted compilation on 02b91d24.
    timeout-minutes: 75
    env:
      DOTNET_gcServer: '0'
      DOTNET_GCConserveMemory: '9'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore and build Release outputs
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "$(jq -r .sdk.version global.json)"
          dotnet restore AuditSphereOps.slnx --locked-mode
          # The exact three-worker CI trial beat the best observed two-worker timing within the
          # memory ceiling. Retain the validated two-worker fallback for rejected artifacts.
          free -b
          python3 scripts/release/ci-api-resource-sampler.py /dev/null DOTNET_BUILD_RESOURCES &
          sampler_pid=$!
          cleanup_sampler() {
            local running
            for running in $(jobs -pr); do
              if [[ $running == "$sampler_pid" ]]; then kill "$sampler_pid" 2>/dev/null || :; fi
            done
            wait "$sampler_pid" 2>/dev/null || :
          }
          trap cleanup_sampler EXIT
          /usr/bin/time -v dotnet build AuditSphereOps.slnx --no-restore --configuration Release --graphBuild --maxcpucount:3 \
            -p:BuildInParallel=true -p:UseSharedCompilation=false -p:RunAnalyzers=false \
            -p:CscEnvironment=DOTNET_PROCESSOR_COUNT=2 \
            -clp:PerformanceSummary

      # The same manifest, confined archive and digest checks protect this same-run handoff and
      # the later full-verification reuse. Packaging is optional; the consumer clean-builds if
      # the artifact is absent or rejected.
      - name: Package exact-run Release outputs
        id: package-parallel-build
        if: ${{ success() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/release/ci_build_artifact.py create \
            --root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/auditsphere-release-build" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$GITHUB_SHA" \
            --dotnet-sdk "$(dotnet --version)" \
            --runner-image "ubuntu-24.04" \
            --runner-version "${ImageVersion:-unknown}"

      - name: Upload exact-run Release outputs
        if: ${{ success() && steps.package-parallel-build.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditsphere-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auditsphere-release-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Fast push/PR gate: compile all projects, run database-free guards and OpenAPI semantics,
  # check model/contract drift and publication. PostgreSQL and full API/browser regressions are
  # deferred to release-verification.yml (nightly + manual, complete suites with verified API shards).
  dotnet-build:
    needs: [change-scope, ui-build, dotnet-release-compile]
    if: ${{ always() && (needs.change-scope.result != 'success' || (needs.change-scope.outputs.full_build != 'false' && needs.ui-build.result == 'success' && (needs.dotnet-release-compile.result == 'success' || needs.dotnet-release-compile.result == 'skipped'))) }}
    name: Build · .NET Release
    runs-on: ubuntu-24.04
    # A runner image version mismatch requires a clean build before the Release guards.
    timeout-minutes: 90
    # Roslyn defaults to server GC; keep the migration-heavy compile within the runner memory limit.
    env:
      DOTNET_gcServer: '0'
      DOTNET_GCConserveMemory: '9'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify pinned .NET SDK
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          sdk = json.loads(Path('global.json').read_text())['sdk']
          assert sdk.get('rollForward') == 'disable', 'Locked restore requires an exact SDK pin'
          actual = subprocess.check_output(['dotnet', '--version'], text=True).strip()
          assert actual == sdk['version'], f"Expected SDK {sdk['version']}, selected {actual}"
          print(f'Verified pinned .NET SDK {actual}')
          PY

      - name: Restore tools and locked packages
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore AuditSphereOps.slnx --locked-mode

      - name: Download exact-run Release outputs
        id: download-parallel-build
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auditsphere-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auditsphere-release-build

      - name: Verify and restore exact-run Release outputs
        id: verify-parallel-build
        if: ${{ steps.download-parallel-build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/auditsphere-release-build-restore.json"
          diagnostic_file="$RUNNER_TEMP/auditsphere-release-build-rejection.txt"
          if python3 scripts/release/ci_build_artifact.py verify-and-extract \
            --root "$GITHUB_WORKSPACE" \
            --artifact-dir "$RUNNER_TEMP/auditsphere-release-build" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-sha "$GITHUB_SHA" \
            --dotnet-sdk "$(dotnet --version)" \
            --runner-image "ubuntu-24.04" \
            --runner-version "${ImageVersion:-unknown}" > "$result_file" 2> "$diagnostic_file"; then
            cat "$result_file"
            printf 'reused=true\n' >> "$GITHUB_OUTPUT"
          else
            cat "$diagnostic_file" >&2
            echo "Same-run Release build artifact was rejected; falling back to a clean build." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Preserve the reason before the long fallback build can lose its runner and logs.
      - name: Retain Release artifact rejection diagnostic
        if: ${{ steps.verify-parallel-build.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditsphere-release-build-rejection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/auditsphere-release-build-rejection.txt
          if-no-files-found: error
          retention-days: 7

      - name: Build Release when parallel outputs are unavailable or rejected
        if: ${{ steps.verify-parallel-build.outputs.reused != 'true' }}
        run: |
          set -euo pipefail
          # If exact-run outputs are unavailable, retain the validated two-worker graph build.
          dotnet build AuditSphereOps.slnx --no-restore --configuration Release --graphBuild --maxcpucount:2 \
            -p:BuildInParallel=true -p:UseSharedCompilation=false -p:RunAnalyzers=false \
            -clp:PerformanceSummary

      - name: Run fast database-free architecture and rounding guards
        run: |
          set -euo pipefail
          dotnet test tests/AuditSphereOps.Domain.Tests/AuditSphereOps.Domain.Tests.csproj --no-build --no-restore \
            --configuration Release --maxcpucount:1 \
            --filter 'FullyQualifiedName~ArchitectureGuardTests|FullyQualifiedName~MaterialityPracticalRoundingTests' \
            --logger 'trx;LogFileName=fast-guards.trx' --results-directory "$RUNNER_TEMP/fast-ci-results"

      # This class generates the real contract in an in-process Test host. It does not
      # create a PostgreSQL fixture or execute the wider authenticated API journeys.
      - name: Verify database-free OpenAPI response semantics
        run: |
          set -euo pipefail
          dotnet test tests/AuditSphereOps.Api.Tests/AuditSphereOps.Api.Tests.csproj --no-build --no-restore \
            --configuration Release --maxcpucount:1 \
            --filter 'FullyQualifiedName~AuditSphereOps.Api.Tests.OpenApiContractTests' \
            --logger 'trx;LogFileName=openapi-contracts.trx' --results-directory "$RUNNER_TEMP/fast-ci-results"

      - name: Upload fast guard results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fast-ci-guards
          path: ${{ runner.temp }}/fast-ci-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Check EF model drift
        run: |
          set -euo pipefail
          dotnet ef migrations has-pending-model-changes --project src/AuditSphereOps.Infrastructure \
            --startup-project src/AuditSphereOps.Api --no-build --configuration Release

      - name: Download Angular browser bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser

      - name: Verify standalone API and Angular publication
        run: |
          set -euo pipefail
          dotnet publish src/AuditSphereOps.Api --no-build --no-restore --configuration Release \
            --output "$RUNNER_TEMP/auditsphere-api"
          test -f "$RUNNER_TEMP/auditsphere-api/AuditSphereOps.Api.dll"
          test -f "$RUNNER_TEMP/auditsphere-api/ui/index.html"
          test ! -f "$RUNNER_TEMP/auditsphere-api/AuditSphereOps.Web.dll"
          test ! -f "$RUNNER_TEMP/auditsphere-api/MudBlazor.dll"

      # Contract drift gate: regenerate the canonical OpenAPI 3.1 document in-memory (no
      # database needed) and fail when the committed artifact is stale. Not a hosted test
      # suite: a single in-process generation check, consistent with the build-gate policy.
      - name: Verify OpenAPI contract drift
        run: bash scripts/contracts/verify-openapi.sh

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '.NET gate outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          printf '\nFast CI includes database-free OpenAPI semantics; PostgreSQL integration and full API/browser suites remain in release-verification.yml. This gate is not full regression evidence.\n' >> "$GITHUB_STEP_SUMMARY"

  # Documentation health gate: canonical-link integrity, naming policy and
  # HISTORICAL_SOURCE banners. Pure stdlib Python; no .NET or database needed.
  docs-health:
    name: Docs · Health
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Markdown documentation health
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-markdown-documentation.py

      - name: Verify audit programme source manifest against Word source
        run: python3 scripts/docs/verify-audit-program-source.py

      - name: Validate capability packets and runner safety guards
        run: |
          set -euo pipefail
          python3 scripts/agent/agent-check.py --validate-catalog
          bash scripts/diagnostics/test-image-build-memory.sh
          python3 scripts/diagnostics/test-image-build-counters.py
          python3 -m unittest discover -s scripts/agent -p 'test_*.py'
          python3 -m unittest discover -s scripts/verification -p 'test_*.py'
          python3 -m unittest discover -s scripts/release -p 'test_ci_*.py'
          python3 -m unittest discover -s scripts/dev/tests -p 'test_*.py'
          python3 -m unittest discover -s scripts/m365 -p 'test_*.py'
          units=(WU-017 WU-018 WU-020 WU-021 WU-022 WU-023 WU-024 WU-025)
          printf '%s\n' "${units[@]}" | xargs -r -P 8 -I '{}' \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 \
              -Unit '{}' -Offline

      - name: Check UI source discovery drift
        run: python3 scripts/ui/inventory.py --check

      - name: Validate Markdown filenames
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-markdown-filenames.py

      - name: Validate narrative documents for volatile metrics
        run: |
          set -euo pipefail
          python3 scripts/docs/validate-narrative-metrics.py

      - name: Summarize
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Docs health outcome: %s\nCommit: %s\nRun: %s / attempt %s\n' \
            "$RESULT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

  # WU-019 is kept intact but isolated from the eight concurrent PowerShell workers above.
  # One hosted run overflowed the PowerShell stack inside its nested enrollment-test process;
  # the isolated unit passed locally, so this avoids same-runner process pressure without
  # weakening or dropping the capability checks.
  m365-tenant-permission-safety:
    name: M365 offline · Tenant permission safety (WU-019)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run offline tenant-permission safety assertions
        run: >-
          pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1
          -Unit WU-019 -Offline
