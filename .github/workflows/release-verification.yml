name: AuditSphere release verification
run-name: AuditSphere release verification · ${{ inputs.ref || 'default branch' }}${{ inputs.correlation && format(' · {0}', inputs.correlation) || '' }}

# Full release contract on one resolved commit. The fast gate in ci.yml keeps its own triggers and
# focused jobs; this workflow is separate and never runs on push or pull_request. The complete
# unfiltered .NET suite runs once per test project, with a separate ephemeral PostgreSQL service for
# every matrix job. A single Release solution build supplies run- and SHA-bound test binaries to the
# matrix, and the Angular production bundle is built once and shared with the API/E2E tests. No test
# project is filtered or omitted, and the aggregate release gate requires every job below.
#
# Every verification command runs through scripts/release/run-verification-step.sh, which records
# its command and exact exit status in the job summary and preserves the full log. Per-project logs
# and TRX files are uploaded as artifacts. No step uses continue-on-error.
#
# Resolve the operator's exact requested ref once, then check out that immutable commit in every
# job. This preserves workflow_dispatch ref selection while preventing moving branches/tags from
# making parallel jobs verify different source revisions.
#
# The release workflow consumes the retained aggregate evidence from this workflow before protected
# release actions. This workflow remains nightly/manual and is not added to the PR check matrix.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA to verify. Leave empty to verify the default branch.
        required: false
        default: ''
        type: string
      correlation:
        description: Optional caller correlation ID (letters, digits, '-', '_' only). Shown in the run name so automation can find its own dispatch.
        required: false
        default: ''
        type: string
  schedule:
    # Nightly at 02:17 UTC, on the default branch.
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: auditsphere-release-verification-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_ENVIRONMENT: Test
  ASPNETCORE_ENVIRONMENT: Test
  ExternalEffects__Enabled: 'false'
  Application__AllowSimulationAdapters: 'true'
  DevelopmentIdentity__Enabled: 'false'
  E2E_BROWSER: chromium

jobs:
  resolve-ref:
    name: Resolve · Requested ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve immutable commit
        id: resolve
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          {
            echo "## Release verification source"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Resolved commit: \`$commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record resolved-source metadata
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          CORRELATION: ${{ inputs.correlation }}
          RESOLVED_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ -n "$CORRELATION" && ! "$CORRELATION" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
            echo "correlation must match ^[A-Za-z0-9_-]{1,64}$" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-verification-source"
          python3 - "$RUNNER_TEMP/release-verification-source/source.json" <<'PY'
          import json, os, sys
          json.dump({
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflowSha": os.environ["GITHUB_SHA"],
              "requestedRef": os.environ["REQUESTED_REF"],
              "resolvedCommit": os.environ["RESOLVED_COMMIT"],
              "correlation": os.environ.get("CORRELATION") or None,
          }, open(sys.argv[1], "w"), indent=2)
          PY

      - name: Upload resolved-source metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-source
          path: ${{ runner.temp }}/release-verification-source/source.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  angular:
    name: Build · Angular and full specs
    needs: resolve-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the resolved requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.commit }}
          persist-credentials: false

      - name: Prepare evidence directories and job summary
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-verification"
          mkdir -p "$evidence/logs" "$evidence/trx"
          echo "VERIFICATION_LOG_DIR=$evidence/logs" >> "$GITHUB_ENV"
          echo "VERIFICATION_TRX_DIR=$evidence/trx" >> "$GITHUB_ENV"
          {
            echo "## Angular verification"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo
            echo "| Step | Command | Exit status | Result |"
            echo "| --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: src/AuditSphereOps.Ui/.nvmrc
          cache: npm
          cache-dependency-path: src/AuditSphereOps.Ui/package-lock.json

      - name: Angular install, production build and full specs
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          RESOLVED_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "npm ci (Angular)" \
            npm --prefix src/AuditSphereOps.Ui ci

          # This is an evidence-only capture, not a security gate. Preserve the helper's exact
          # result and exit status while allowing the existing Angular checks to run unchanged.
          scan_evidence=artifacts/completion/wu038-scans
          mkdir -p "$scan_evidence"
          helper_stderr="$scan_evidence/npm-helper-stderr.txt"
          set +e
          python3 scripts/verification/capture-operational-scan.py --scan npm \
            > "$scan_evidence/npm-helper-result.json" 2> "$helper_stderr"
          helper_exit=$?
          set -e
          helper_stderr_bytes=$(wc -c < "$helper_stderr" | tr -d '[:space:]')
          helper_stderr_truncated=false
          if (( helper_stderr_bytes > 16384 )); then
            head -c 16384 "$helper_stderr" > "$helper_stderr.tmp"
            mv "$helper_stderr.tmp" "$helper_stderr"
            helper_stderr_truncated=true
          fi
          helper_stderr_retained_bytes=$(wc -c < "$helper_stderr" | tr -d '[:space:]')
          helper_stderr_sha256=$(sha256sum "$helper_stderr" | cut -d' ' -f1)
          jq -n --arg requestedRef "$REQUESTED_REF" --arg resolvedCommit "$RESOLVED_COMMIT" \
            --arg helperStderrPath "$helper_stderr" --arg helperStderrSha256 "$helper_stderr_sha256" \
            --argjson helperExitCode "$helper_exit" --argjson helperStderrBytes "$helper_stderr_bytes" \
            --argjson helperStderrRetainedBytes "$helper_stderr_retained_bytes" \
            --argjson helperStderrTruncated "$helper_stderr_truncated" \
            '{requestedRef:$requestedRef,resolvedCommit:$resolvedCommit,helperExitCode:$helperExitCode,helperStderrPath:$helperStderrPath,helperStderrSha256:$helperStderrSha256,helperStderrBytes:$helperStderrBytes,helperStderrRetainedBytes:$helperStderrRetainedBytes,helperStderrTruncated:$helperStderrTruncated,securityAssessment:"NOT_ASSESSED"}' \
            > "$scan_evidence/npm-workflow-metadata.json"
          echo "Operational npm helper exitCode=$helper_exit; helper diagnostic retained in the scan artifact; securityAssessment=NOT_ASSESSED." \
            >> "$GITHUB_STEP_SUMMARY"

          bash scripts/release/run-verification-step.sh "Angular production lint" \
            npm --prefix src/AuditSphereOps.Ui run lint:ci
          bash scripts/release/run-verification-step.sh "Angular production build" \
            npm --prefix src/AuditSphereOps.Ui run build
          bash scripts/release/run-verification-step.sh "Angular full specs (test:ci)" \
            npm --prefix src/AuditSphereOps.Ui run test:ci

      - name: Upload Angular browser bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser
          retention-days: 1

      - name: Upload npm operational scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-operational-scan-npm-${{ needs.resolve-ref.outputs.commit }}
          path: artifacts/completion/wu038-scans
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Upload Angular verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-logs-angular
          path: ${{ runner.temp }}/release-verification/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Record Angular job outcome
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo
            echo "Angular verification outcome: \`$RESULT\`"
            echo "Commit: \`$SOURCE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  dotnet-tests:
    name: Test · .NET ${{ matrix.name }} (unfiltered)
    needs: [resolve-ref, angular, release-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Domain
            key: domain
            project: tests/AuditSphereOps.Domain.Tests/AuditSphereOps.Domain.Tests.csproj
            assembly: AuditSphereOps.Domain.Tests
          - name: API
            key: api
            project: tests/AuditSphereOps.Api.Tests/AuditSphereOps.Api.Tests.csproj
            assembly: AuditSphereOps.Api.Tests
          - name: Playwright E2E
            key: e2e
            project: tests/AuditSphereOps.E2E.Tests/AuditSphereOps.E2E.Tests.csproj
            assembly: AuditSphereOps.E2E.Tests
    services:
      # Each matrix child runs on its own runner and receives its own PostgreSQL service/container.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: auditsphere_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # --init makes a minimal init process PID 1. Without it PostgreSQL is PID 1, reaps health-check processes
        # orphaned by a timeout, and treats their non-zero exit as a backend crash ("untracked child process ...
        # exited with exit code 2"), restarting every connection mid-suite. The longer timeout keeps checks from
        # timing out while template databases are being copied; the larger /dev/shm serves parallel queries.
        options: >-
          --init
          --shm-size 1g
          --health-cmd "pg_isready -U postgres -d auditsphere_tests"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 10
    # Bound Roslyn and test-host GC memory while compiling the large EF migration model.
    env:
      DOTNET_gcServer: '0'
      DOTNET_GCConserveMemory: '9'
      AUDITSPHERE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=auditsphere_tests;Username=postgres;Password=postgres;Pooling=false
      TEST_PROJECT: ${{ matrix.project }}
      TEST_PROJECT_KEY: ${{ matrix.key }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the resolved requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.commit }}
          persist-credentials: false

      - name: Prepare evidence directories and project outcome summary
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
          TEST_PROJECT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-verification"
          mkdir -p "$evidence/logs" "$evidence/trx"
          echo "VERIFICATION_LOG_DIR=$evidence/logs" >> "$GITHUB_ENV"
          echo "VERIFICATION_TRX_DIR=$evidence/trx" >> "$GITHUB_ENV"
          {
            echo "## .NET test project: $TEST_PROJECT_NAME"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Project: \`$TEST_PROJECT\`"
            echo "- PostgreSQL: isolated service for this matrix job"
            echo
            echo "| Step | Command | Exit status | Result |"
            echo "| --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify pinned SDK and restore project dependencies
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "Pinned .NET SDK disables roll-forward" \
            jq -e '.sdk.rollForward == "disable"' global.json
          bash scripts/release/run-verification-step.sh "Selected .NET SDK matches global.json" \
            bash -c 'test "$(dotnet --version)" = "$(jq -r .sdk.version global.json)"'
          bash scripts/release/run-verification-step.sh "dotnet restore (locked mode, $TEST_PROJECT_KEY)" \
            dotnet restore "$TEST_PROJECT" --locked-mode

      - name: Download Angular browser bundle for API and E2E hosts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser

      - name: Download source-bound test build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-verification-test-build-${{ needs.resolve-ref.outputs.commit }}-${{ github.run_id }}-${{ matrix.key }}
          path: ${{ runner.temp }}/release-verification-test-build

      - name: Verify artifact provenance and restore Release output
        env:
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
          TEST_ASSEMBLY: ${{ matrix.assembly }}
          EXPECTED_BUILD_ARTIFACT: release-verification-test-build-${{ needs.resolve-ref.outputs.commit }}-${{ github.run_id }}-${{ matrix.key }}
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "Verify source-bound test build artifact ($TEST_PROJECT_KEY)" bash -c '
            set -euo pipefail
            manifest="$RUNNER_TEMP/release-verification-test-build/source.json"
            binary_root="$RUNNER_TEMP/release-verification-test-build/bin/Release/net10.0"
            output_root="${TEST_PROJECT%/*}/bin/Release/net10.0"
            expected_sdk="$(jq -r .sdk.version global.json)"
            actual_sdk="$(dotnet --version)"
            test "$actual_sdk" = "$expected_sdk"
            jq -e \
              --arg artifact "$EXPECTED_BUILD_ARTIFACT" \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg commit "$SOURCE_COMMIT" \
              --arg project "$TEST_PROJECT" \
              --arg assembly "$TEST_ASSEMBLY" \
              --arg sdk "$actual_sdk" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg machine "$(uname -m)" \
              --arg operatingSystem "$(uname -s)" \
              ".schemaVersion == 1 and .artifactName == \$artifact and .repository == \$repository and .resolvedCommit == \$commit and .project == \$project and .assembly == \$assembly and .configuration == \"Release\" and .targetFramework == \"net10.0\" and .dotnetSdk == \$sdk and .runId == (\$runId | tonumber) and .runAttempt >= 1 and .runAttempt <= (\$runAttempt | tonumber) and .machine == \$machine and .operatingSystem == \$operatingSystem" \
              "$manifest" >/dev/null
            test -s "$binary_root/$TEST_ASSEMBLY.dll"
            test -s "$binary_root/$TEST_ASSEMBLY.deps.json"
            test -s "$binary_root/$TEST_ASSEMBLY.runtimeconfig.json"
            if [ "$TEST_PROJECT_KEY" = e2e ]; then
              test -s "$binary_root/playwright.ps1"
              test -s "$binary_root/.playwright/node/linux-x64/node"
              test -s "$binary_root/.playwright/package/lib/coreBundle.js"
            fi
            mkdir -p "$output_root"
            cp -a "$binary_root/." "$output_root/"
            echo "Verified $EXPECTED_BUILD_ARTIFACT for $SOURCE_COMMIT, workflow run $GITHUB_RUN_ID, build attempt $(jq -r .runAttempt "$manifest"), SDK $actual_sdk, $TEST_PROJECT."
          '

      - name: Build and run the complete unfiltered test project
        run: |
          set -euo pipefail
          if [ "$TEST_PROJECT_KEY" = e2e ]; then
            bash scripts/release/run-verification-step.sh "Playwright Chromium install" \
              pwsh tests/AuditSphereOps.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
          fi
          bash scripts/release/run-verification-step.sh "Full $TEST_PROJECT_KEY test project (no --filter)" \
            dotnet test "$TEST_PROJECT" --no-build --no-restore --configuration Release --maxcpucount:1 \
            --logger "trx;LogFileName=$TEST_PROJECT_KEY.trx" --logger "console;verbosity=normal" \
            --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none \
            --results-directory "$VERIFICATION_TRX_DIR"

      - name: Capture PostgreSQL service diagnostics
        if: ${{ always() }}
        run: |
          set -uo pipefail
          diagnostics_dir="${VERIFICATION_LOG_DIR:-${RUNNER_TEMP:-/tmp}/release-verification/logs}"
          mkdir -p "$diagnostics_dir"
          container_id="$(docker ps -aq --filter 'ancestor=postgres:18.6' | head -n 1)"
          if [ -n "$container_id" ]; then
            docker logs "$container_id" > "$diagnostics_dir/postgres-service.log" 2>&1 || true
          else
            printf 'PostgreSQL service container was not available for log capture.\n' \
              > "$diagnostics_dir/postgres-service.log"
          fi

      - name: Upload ${{ matrix.name }} command logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-logs-${{ matrix.key }}
          path: ${{ runner.temp }}/release-verification/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ${{ matrix.name }} TRX results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-trx-${{ matrix.key }}
          path: ${{ runner.temp }}/release-verification/trx
          if-no-files-found: warn
          retention-days: 30

      - name: Record ${{ matrix.name }} project outcome
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo
            echo "$TEST_PROJECT_KEY test outcome: \`$RESULT\`"
            echo "Project: \`$TEST_PROJECT\`"
            echo "Commit: \`$SOURCE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-contract:
    name: Verify · Build, contracts and publication
    needs: [resolve-ref, angular]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Keep Roslyn within the runner memory limit while compiling the migration-heavy projects.
    env:
      DOTNET_gcServer: '0'
      DOTNET_GCConserveMemory: '9'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the resolved requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.commit }}
          persist-credentials: false

      - name: Prepare evidence directories and job summary
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-verification"
          mkdir -p "$evidence/logs" "$evidence/trx"
          echo "VERIFICATION_LOG_DIR=$evidence/logs" >> "$GITHUB_ENV"
          echo "VERIFICATION_TRX_DIR=$evidence/trx" >> "$GITHUB_ENV"
          {
            echo "## Build, contract and publication verification"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo
            echo "| Step | Command | Exit status | Result |"
            echo "| --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify SDK, restore tools and packages, then build Release
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "Pinned .NET SDK disables roll-forward" \
            jq -e '.sdk.rollForward == "disable"' global.json
          bash scripts/release/run-verification-step.sh "Selected .NET SDK matches global.json" \
            bash -c 'test "$(dotnet --version)" = "$(jq -r .sdk.version global.json)"'
          bash scripts/release/run-verification-step.sh "dotnet tool restore" dotnet tool restore
          bash scripts/release/run-verification-step.sh "dotnet restore (locked mode)" \
            dotnet restore AuditSphereOps.slnx --locked-mode
          bash scripts/release/run-verification-step.sh "dotnet build (Release, one MSBuild node)" \
            dotnet build AuditSphereOps.slnx --no-restore --configuration Release --maxcpucount:1 \
              -p:BuildInParallel=false -p:UseSharedCompilation=false

      - name: Capture NuGet operational scan evidence
        env:
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          RESOLVED_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          scan_evidence=artifacts/completion/wu038-scans
          mkdir -p "$scan_evidence"
          helper_stderr="$scan_evidence/nuget-helper-stderr.txt"
          set +e
          python3 scripts/verification/capture-operational-scan.py --scan nuget \
            > "$scan_evidence/nuget-helper-result.json" 2> "$helper_stderr"
          helper_exit=$?
          set -e
          helper_stderr_bytes=$(wc -c < "$helper_stderr" | tr -d '[:space:]')
          helper_stderr_truncated=false
          if (( helper_stderr_bytes > 16384 )); then
            head -c 16384 "$helper_stderr" > "$helper_stderr.tmp"
            mv "$helper_stderr.tmp" "$helper_stderr"
            helper_stderr_truncated=true
          fi
          helper_stderr_retained_bytes=$(wc -c < "$helper_stderr" | tr -d '[:space:]')
          helper_stderr_sha256=$(sha256sum "$helper_stderr" | cut -d' ' -f1)
          jq -n --arg requestedRef "$REQUESTED_REF" --arg resolvedCommit "$RESOLVED_COMMIT" \
            --arg helperStderrPath "$helper_stderr" --arg helperStderrSha256 "$helper_stderr_sha256" \
            --argjson helperExitCode "$helper_exit" --argjson helperStderrBytes "$helper_stderr_bytes" \
            --argjson helperStderrRetainedBytes "$helper_stderr_retained_bytes" \
            --argjson helperStderrTruncated "$helper_stderr_truncated" \
            '{requestedRef:$requestedRef,resolvedCommit:$resolvedCommit,helperExitCode:$helperExitCode,helperStderrPath:$helperStderrPath,helperStderrSha256:$helperStderrSha256,helperStderrBytes:$helperStderrBytes,helperStderrRetainedBytes:$helperStderrRetainedBytes,helperStderrTruncated:$helperStderrTruncated,securityAssessment:"NOT_ASSESSED"}' \
            > "$scan_evidence/nuget-workflow-metadata.json"
          echo "Operational NuGet helper exitCode=$helper_exit; helper diagnostic retained in the scan artifact; securityAssessment=NOT_ASSESSED." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: EF model drift and OpenAPI contract drift
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "EF model drift check" \
            dotnet ef migrations has-pending-model-changes --project src/AuditSphereOps.Infrastructure \
            --startup-project src/AuditSphereOps.Api --no-build --configuration Release
          bash scripts/release/run-verification-step.sh "OpenAPI contract drift" \
            bash scripts/contracts/verify-openapi.sh

      - name: Download Angular browser bundle for standalone publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: src/AuditSphereOps.Ui/dist/auditsphere-ui/browser

      - name: Standalone API and Angular publication
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/auditsphere-api"
          bash scripts/release/run-verification-step.sh "dotnet publish Api (no build)" \
            dotnet publish src/AuditSphereOps.Api --no-build --no-restore --configuration Release --output "$publish"
          bash scripts/release/run-verification-step.sh "Published host has Api, Angular shell and no Web host" \
            bash -c 'set -e; test -f "$1/AuditSphereOps.Api.dll"; test -f "$1/ui/index.html"; test ! -f "$1/AuditSphereOps.Web.dll"; test ! -f "$1/MudBlazor.dll"' _ "$publish"

      - name: Documentation, agent catalog and UI inventory validators
        run: |
          set -euo pipefail
          bash scripts/release/run-verification-step.sh "Markdown documentation health" \
            python3 scripts/docs/validate-markdown-documentation.py
          bash scripts/release/run-verification-step.sh "Markdown filenames" \
            python3 scripts/docs/validate-markdown-filenames.py
          bash scripts/release/run-verification-step.sh "Narrative volatile metrics" \
            python3 scripts/docs/validate-narrative-metrics.py
          bash scripts/release/run-verification-step.sh "Agent capability catalog" \
            python3 scripts/agent/agent-check.py --validate-catalog
          bash scripts/release/run-verification-step.sh "Agent runner safety unit tests" \
            python3 -m unittest discover -s scripts/agent -p 'test_*.py'
          bash scripts/release/run-verification-step.sh "Exact-source release evidence unit tests" \
            python3 -m unittest discover -s scripts/release -p 'test_verify_release_source.py'
          bash scripts/release/run-verification-step.sh "Verification evidence guard unit tests" \
            python3 -m unittest discover -s scripts/verification -p 'test_*.py'
          bash scripts/release/run-verification-step.sh "M365 result contract unit tests" \
            python3 -m unittest discover -s scripts/m365 -p 'test_*.py'
          bash scripts/release/run-verification-step.sh "Offline M365 prerequisite and plan checks" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-017 -Offline
          bash scripts/release/run-verification-step.sh "Offline Entra registration reconciliation" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-018 -Offline
          bash scripts/release/run-verification-step.sh "Offline Entra permission grant reconciliation" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-019 -Offline
          bash scripts/release/run-verification-step.sh "Offline selected document sites reconciliation" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-020 -Offline
          bash scripts/release/run-verification-step.sh "Offline SharePoint client sites reconciliation" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-021 -Offline
          bash scripts/release/run-verification-step.sh "Offline mail permission-model plan boundaries" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-022 -Offline
          bash scripts/release/run-verification-step.sh "Offline secondary archive evidence boundaries" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-023 -Offline
          bash scripts/release/run-verification-step.sh "Offline deployment credential binding boundaries" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-024 -Offline
          bash scripts/release/run-verification-step.sh "Offline M365 readiness evidence boundaries" \
            pwsh -NoProfile -NonInteractive -File scripts/m365/Test-Automation.ps1 -Unit WU-025 -Offline
          bash scripts/release/run-verification-step.sh "UI source discovery drift" \
            python3 scripts/ui/inventory.py --check

      - name: Stage source-bound unfiltered test outputs
        env:
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          expected_sdk="$(jq -r .sdk.version global.json)"
          actual_sdk="$(dotnet --version)"
          test "$actual_sdk" = "$expected_sdk"
          artifact_root="$RUNNER_TEMP/release-verification-test-build"
          mkdir -p "$artifact_root"
          for key in domain api e2e; do
            case "$key" in
              domain) project=tests/AuditSphereOps.Domain.Tests/AuditSphereOps.Domain.Tests.csproj ;;
              api) project=tests/AuditSphereOps.Api.Tests/AuditSphereOps.Api.Tests.csproj ;;
              e2e) project=tests/AuditSphereOps.E2E.Tests/AuditSphereOps.E2E.Tests.csproj ;;
              *) echo "Unexpected test project key: $key" >&2; exit 2 ;;
            esac
            assembly="$(basename "$project" .csproj)"
            source_output="${project%/*}/bin/Release/net10.0"
            staging="$artifact_root/$key"
            test -s "$source_output/$assembly.dll"
            test -s "$source_output/$assembly.deps.json"
            test -s "$source_output/$assembly.runtimeconfig.json"
            if [ "$key" = e2e ]; then
              test -s "$source_output/playwright.ps1"
              test -s "$source_output/.playwright/node/linux-x64/node"
              test -s "$source_output/.playwright/package/lib/coreBundle.js"
            fi
            mkdir -p "$staging/bin/Release/net10.0"
            cp -a "$source_output/." "$staging/bin/Release/net10.0/"
            ARTIFACT_NAME="release-verification-test-build-${SOURCE_COMMIT}-${GITHUB_RUN_ID}-${key}" \
              PROJECT="$project" ASSEMBLY="$assembly" DOTNET_SDK="$actual_sdk" \
              python3 - "$staging/source.json" <<'PY'
          import json, os, platform, sys
          json.dump({
              "schemaVersion": 1,
              "artifactName": os.environ["ARTIFACT_NAME"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "resolvedCommit": os.environ["SOURCE_COMMIT"],
              "project": os.environ["PROJECT"],
              "assembly": os.environ["ASSEMBLY"],
              "configuration": "Release",
              "targetFramework": "net10.0",
              "dotnetSdk": os.environ["DOTNET_SDK"],
              "operatingSystem": platform.system(),
              "machine": platform.machine(),
          }, open(sys.argv[1], "w"), indent=2)
          PY
          done

      - name: Upload source-bound Domain test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-test-build-${{ needs.resolve-ref.outputs.commit }}-${{ github.run_id }}-domain
          path: ${{ runner.temp }}/release-verification-test-build/domain
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          include-hidden-files: true

      - name: Upload source-bound API test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-test-build-${{ needs.resolve-ref.outputs.commit }}-${{ github.run_id }}-api
          path: ${{ runner.temp }}/release-verification-test-build/api
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          include-hidden-files: true

      - name: Upload source-bound E2E test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-test-build-${{ needs.resolve-ref.outputs.commit }}-${{ github.run_id }}-e2e
          path: ${{ runner.temp }}/release-verification-test-build/e2e
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          include-hidden-files: true

      - name: Upload build and contract verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-logs-contract
          path: ${{ runner.temp }}/release-verification/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NuGet operational scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-operational-scan-nuget-${{ needs.resolve-ref.outputs.commit }}
          path: artifacts/completion/wu038-scans
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Record build and contract outcome
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo
            echo "Build and contract verification outcome: \`$RESULT\`"
            echo "Commit: \`$SOURCE_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    name: Verify · Full release contract
    if: ${{ always() }}
    needs: [resolve-ref, angular, dotnet-tests, release-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the resolved source for evidence generation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve-ref.outputs.commit }}
          persist-credentials: false

      - name: Require every release verification job to pass
        env:
          SOURCE_RESULT: ${{ needs.resolve-ref.result }}
          ANGULAR_RESULT: ${{ needs.angular.result }}
          DOTNET_RESULT: ${{ needs.dotnet-tests.result }}
          CONTRACT_RESULT: ${{ needs.release-contract.result }}
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo "## Full release contract aggregate"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Resolved commit: \`$SOURCE_COMMIT\`"
            echo
            echo "| Required gate | Result |"
            echo "| --- | --- |"
            echo "| Resolve requested ref | $SOURCE_RESULT |"
            echo "| Angular build and full specs | $ANGULAR_RESULT |"
            echo "| All unfiltered .NET project suites | $DOTNET_RESULT |"
            echo "| Build, contracts and publication | $CONTRACT_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SOURCE_RESULT" != success || "$ANGULAR_RESULT" != success || \
                "$DOTNET_RESULT" != success || "$CONTRACT_RESULT" != success ]]; then
            echo "Release verification failed: one or more required gates did not succeed." >&2
            exit 1
          fi
          echo "All release verification gates passed for $SOURCE_COMMIT."

      - name: Download .NET test result artifacts for evidence counting
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-verification-trx-*
          path: ${{ runner.temp }}/release-verification/retained-trx
          merge-multiple: false

      - name: Record full-regression evidence for the resolved source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.ref || github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ needs.resolve-ref.outputs.commit }}
          SOURCE_RESULT: ${{ needs.resolve-ref.result }}
          ANGULAR_RESULT: ${{ needs.angular.result }}
          DOTNET_RESULT: ${{ needs.dotnet-tests.result }}
          CONTRACT_RESULT: ${{ needs.release-contract.result }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            > "$RUNNER_TEMP/release-verification/run-artifacts.json"
          python3 scripts/release/verify-release-source.py record \
            --repository "$REPOSITORY" --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --event "$EVENT_NAME" --head-sha "$HEAD_SHA" \
            --requested-ref "$REQUESTED_REF" --resolved-commit "$SOURCE_COMMIT" \
            --job "resolve-ref=$SOURCE_RESULT" --job "angular=$ANGULAR_RESULT" \
            --job "dotnet-tests=$DOTNET_RESULT" --job "release-contract=$CONTRACT_RESULT" \
            --trx-root "$RUNNER_TEMP/release-verification/retained-trx" \
            --run-artifacts "$RUNNER_TEMP/release-verification/run-artifacts.json" \
            --output "$RUNNER_TEMP/release-verification/release-verification-evidence.json"

      - name: Upload exact-source full-regression evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-evidence-${{ needs.resolve-ref.outputs.commit }}
          path: ${{ runner.temp }}/release-verification/release-verification-evidence.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
