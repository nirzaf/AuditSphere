# AuditSphere production release pipeline.
#
# Dispatch-only (never runs on push); the production Azure environment must be protected by a
# GitHub environment approval. The pipeline needs owner-approved plumbing before first use:
#   - an Azure AD application with a federated credential for this repository (OIDC, no stored
#     secrets) holding Contributor on the target resource group,
#   - an Azure Container Registry accepted by the owner,
#   - deployment secrets (connection string, identity client secret, PostgreSQL admin password)
#     created in the environment Key Vault through the approved secret process.
# Until that plumbing exists, every live step remains BLOCKED_EXTERNAL and is not faked here.
#
# Release preconditions: exact-source fast CI must pass before candidate work starts. After that,
# the read-only full-regression evidence check and credential-free image builds can run in parallel.
# The protected release job still requires both gates and all three verified archives; Azure
# authentication, ACR writes and deployment remain inside that protected environment job.
#
# Deployment order per the architecture contract:
#   verify exact-source fast CI (read-only)
#     -> in parallel: verify exact-source full CI evidence and build source-bound image archives
#        without registry credentials
#     -> require both full evidence and all image archives before protected release
#     -> approve the protected environment, then publish captured tags and deploy registry digests
#     -> run the migration job (failure blocks the release)
#     -> deploy API + worker revisions
#     -> canary: split 10% of API traffic to the new revision
#     -> smoke checks (liveness, readiness, read-only route)
#     -> promote to 100% or roll traffic back to the previous revision
# Workers do not serve traffic; their rollback is redeploying the previous image digest.

name: AuditSphere release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (Azure environment name with approval protection)
        required: true
        default: production
        type: choice
        options: [production, acceptance]
      azure_resource_group:
        description: Target resource group
        required: true
      azure_client_id:
        description: Entra application (client) id for OIDC federation
        required: true
      azure_tenant_id:
        description: Entra tenant id
        required: true
      azure_subscription_id:
        description: Azure subscription id
        required: true
      acr_name:
        description: Azure Container Registry login server name without .azurecr.io
        required: true
      name_prefix:
        description: Deployment name prefix used by the environment definition
        required: true
        default: auditsphere-prod

permissions:
  contents: read

concurrency:
  group: auditsphere-release-${{ inputs.environment }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  # Read-only precondition. It needs only actions:read on this repository, no Azure credentials and
  # no protected environment, so a commit without a successful CI run is refused before any approval.
  # The query is pinned to the exact SHA this dispatch is releasing (github.sha).
  verify-ci-passed:
    name: Precondition · CI passed for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact release source for CI artifact discovery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require a successful ci.yml run for the exact commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          runs="$(gh api --paginate \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == env.RELEASE_SHA and .conclusion == "success") | .html_url')"
          if [ -z "$runs" ]; then
            {
              echo "## Release refused"
              echo
              echo "No successful \`ci.yml\` run exists for commit \`${RELEASE_SHA}\`."
              echo "Wait for CI on this commit to pass, or release a commit that has passed CI."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No successful ci.yml run exists for ${RELEASE_SHA}; release refused." >&2
            exit 1
          fi
          {
            echo "## Release precondition passed"
            echo
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Successful ci.yml run(s):"
            printf '%s\n' "$runs" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"


  verify-release-source:
    name: Precondition · Full regression passed for this commit
    needs: verify-ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
      EVIDENCE_NAME: release-verification-evidence-${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Collect trusted verification evidence and refuse stale or incomplete candidates
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/runs" "$tmp/evidence"
          gh api "repos/${REPOSITORY}/actions/workflows/release-verification.yml" > "$tmp/workflow.json"
          gh api "repos/${REPOSITORY}" > "$tmp/repository.json"
          gh api --paginate "repos/${REPOSITORY}/actions/artifacts?per_page=100" \
            -f name="$EVIDENCE_NAME" > "$tmp/artifacts.json"

          jq -s -r --arg name "$EVIDENCE_NAME" \
            '[.[] | .artifacts[]? | select(.name == $name and .workflow_run.id != null and .expired == false and .size_in_bytes > 0 and (.expires_at | fromdateiso8601) > now)] | sort_by(.id) | reverse | .[0:10][] | [.id, .workflow_run.id] | @tsv' \
            "$tmp/artifacts.json" > "$tmp/candidates.tsv"
          if [ ! -s "$tmp/candidates.tsv" ]; then
            echo "::error::No full-regression evidence artifact exists for ${RELEASE_SHA}; release refused." >&2
            exit 1
          fi

          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "$artifact_id" ] && [ -n "$run_id" ] || continue
            if [ ! -f "$tmp/runs/${run_id}.json" ]; then
              if ! gh api "repos/${REPOSITORY}/actions/runs/${run_id}" > "$tmp/runs/${run_id}.json" || \
                 ! gh api "repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$tmp/runs/${run_id}.artifacts.json"; then
                rm -f "$tmp/runs/${run_id}.json" "$tmp/runs/${run_id}.artifacts.json"
                continue
              fi
            fi
            if ! gh api "repos/${REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$tmp/evidence/${artifact_id}.zip"; then
              rm -f "$tmp/evidence/${artifact_id}.zip"
            fi
          done < "$tmp/candidates.tsv"

          trusted_branch="$(jq -r '.default_branch' "$tmp/repository.json")"
          python3 scripts/release/verify-release-source.py verify \
            --candidate-sha "$RELEASE_SHA" --repository "$REPOSITORY" --trusted-branch "$trusted_branch" \
            --workflow "$tmp/workflow.json" --artifacts "$tmp/artifacts.json" \
            --runs-dir "$tmp/runs" --evidence-dir "$tmp/evidence" \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build · ${{ matrix.name }} image from fast-CI-qualified source
    needs: [verify-ci-passed]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: api
            name: API
            image: auditsphere-api
            cacheImage: auditsphere-acceptance-api
            dockerfile: src/AuditSphereOps.Api/Dockerfile
          - key: worker
            name: Worker
            image: auditsphere-worker
            cacheImage: auditsphere-acceptance-worker
            dockerfile: src/AuditSphereOps.Worker/Dockerfile
          - key: migrations
            name: Migrations
            image: auditsphere-migrations
            cacheImage: auditsphere-acceptance-migrations
            dockerfile: infra/docker/migrations.Dockerfile
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact fast-CI-qualified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate registry input and exact checkout
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      # Optional artifact discovery is scoped to the API image and runs in parallel with the
      # worker/migrations builds and full-regression evidence check. The exact-source fallback
      # remains available when discovery or download does not produce a valid bundle.
      - name: Find optional exact-source Angular bundle artifact
        id: find-angular
        if: ${{ matrix.key == 'api' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/${REPOSITORY}" --jq .default_branch)"
          python3 scripts/release/ci_build_artifact.py find-angular-bundle \
            --api-url https://api.github.com \
            --repository "$REPOSITORY" \
            --branch "$default_branch" \
            --source-sha "$RELEASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact-source Angular bundle when retained
        id: download-angular
        if: ${{ matrix.key == 'api' && steps.find-angular.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: ${{ runner.temp }}/release-angular-ui
          repository: ${{ github.repository }}
          run-id: ${{ steps.find-angular.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Prepare verified UI bundle or Dockerfile source-build fallback
        id: prepare-angular
        if: ${{ matrix.key == 'api' }}
        run: |
          set -euo pipefail
          test -f release-assets/angular/.keep
          python3 scripts/release/ci_build_artifact.py prepare-angular-context \
            --artifact-dir "$RUNNER_TEMP/release-angular-ui" \
            --context-dir "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"
          available="$(sed -n 's/^available=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [ "$available" = true ]; then
            echo "Reusing tested Angular bundle from successful exact-source CI run ${{ steps.find-angular.outputs.run_id }}." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Exact-source Angular artifact unavailable; API Dockerfile will build Angular from this checkout." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # The credential-free Hostinger image workflow warms these registry caches on each
      # relevant master push. Import the matching cache here as well as the per-release GHA
      # cache so a protected release can reuse already-built layers without changing its
      # source, image validation, approval, or deployment gates.
      - name: Log in to GHCR to read the shared image build cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Buildx with isolated image cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build image and stage a source-bound archive
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ inputs.acr_name }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
          load: true
          build-args: ${{ matrix.key == 'api' && format('USE_PREBUILT_ANGULAR={0}', steps.prepare-angular.outputs.available) || '' }}
          cache-from: |
            type=gha,scope=auditsphere-release-${{ matrix.key }}
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.cacheImage }}:buildcache
          cache-to: type=gha,scope=auditsphere-release-${{ matrix.key }},mode=max,ignore-error=true,timeout=3m

      - name: Package and record the exact source image for the approval-gated release
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          IMAGE_KEY: ${{ matrix.key }}
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ANGULAR_BUNDLE_AVAILABLE: ${{ matrix.key == 'api' && steps.prepare-angular.outputs.available == 'true' }}
          ANGULAR_BUNDLE_RUN_ID: ${{ matrix.key == 'api' && steps.find-angular.outputs.run_id || '' }}
          ANGULAR_BUNDLE_RUN_ATTEMPT: ${{ matrix.key == 'api' && steps.find-angular.outputs.run_attempt || '' }}
          ANGULAR_BUNDLE_ARTIFACT_ID: ${{ matrix.key == 'api' && steps.find-angular.outputs.artifact_id || '' }}
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          image_ref="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          test "$(docker image inspect "$image_ref" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          artifact_dir="$RUNNER_TEMP/release-image"
          mkdir -p "$artifact_dir"
          docker save --output "$artifact_dir/image.tar" "$image_ref"
          IMAGE_REF="$image_ref" \
            python3 - "$artifact_dir/source.json" <<'PY'
          import hashlib, json, os, pathlib, platform, sys
          archive = pathlib.Path(sys.argv[1]).with_name("image.tar")
          with archive.open("rb") as stream:
              digest = hashlib.file_digest(stream, "sha256").hexdigest()
          json.dump({
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflowRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "sourceSha": os.environ["GITHUB_SHA"],
              "imageKey": os.environ["IMAGE_KEY"],
              "imageName": os.environ["IMAGE_NAME"],
              "dockerfile": os.environ["DOCKERFILE"],
              "imageRef": os.environ["IMAGE_REF"],
              "platform": "linux/amd64",
              "archiveFile": archive.name,
              "archiveSha256": digest,
              "archiveBytes": archive.stat().st_size,
              "cacheScope": f"auditsphere-release-{os.environ['IMAGE_KEY']}",
              "prebuiltAngular": os.environ["ANGULAR_BUNDLE_AVAILABLE"] == "true",
              "angularBundleCiRunId": int(os.environ["ANGULAR_BUNDLE_RUN_ID"]) if os.environ["ANGULAR_BUNDLE_AVAILABLE"] == "true" else None,
              "angularBundleCiRunAttempt": int(os.environ["ANGULAR_BUNDLE_RUN_ATTEMPT"]) if os.environ["ANGULAR_BUNDLE_AVAILABLE"] == "true" else None,
              "angularBundleArtifactId": int(os.environ["ANGULAR_BUNDLE_ARTIFACT_ID"]) if os.environ["ANGULAR_BUNDLE_AVAILABLE"] == "true" else None,
              "runnerArchitecture": platform.machine(),
          }, open(sys.argv[1], "w"), indent=2)
          PY
          {
            echo "## Release image staged before environment approval"
            echo
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Image: \`$image_ref\`"
            echo "- Archive SHA-256: \`$(jq -r .archiveSha256 "$artifact_dir/source.json")\`"
            echo "- ACR push and deployment remain behind the protected environment approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image input for this workflow attempt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-image
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  release:
    needs: [verify-ci-passed, verify-release-source, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # Check out the exact commit the precondition verified, not the branch tip at checkout time.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact-run image archives concurrently
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-images
          merge-multiple: false

      - name: Verify image provenance and load exact image tags
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          registry="$ACR_NAME.azurecr.io"
          artifact_root="$RUNNER_TEMP/release-images"
          expected_artifacts="$(printf '%s\n' \
            "release-image-api-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "release-image-migrations-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "release-image-worker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" | LC_ALL=C sort)"
          actual_artifacts="$(find "$artifact_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          test "$actual_artifacts" = "$expected_artifacts"
          for key in api worker migrations; do
            case "$key" in
              api) image_name=auditsphere-api; dockerfile=src/AuditSphereOps.Api/Dockerfile ;;
              worker) image_name=auditsphere-worker; dockerfile=src/AuditSphereOps.Worker/Dockerfile ;;
              migrations) image_name=auditsphere-migrations; dockerfile=infra/docker/migrations.Dockerfile ;;
            esac
            artifact_dir="$artifact_root/release-image-$key-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            manifest="$artifact_dir/source.json"
            archive="$artifact_dir/image.tar"
            expected_image="$registry/$image_name:$GITHUB_SHA"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg runId "$GITHUB_RUN_ID" \
              --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
              --arg sourceSha "$GITHUB_SHA" \
              --arg imageKey "$key" \
              --arg imageName "$image_name" \
              --arg dockerfile "$dockerfile" \
              --arg imageRef "$expected_image" \
              '.schemaVersion == 1 and .repository == $repository and .workflowRunId == ($runId | tonumber) and .workflowRunAttempt == ($runAttempt | tonumber) and .sourceSha == $sourceSha and .imageKey == $imageKey and .imageName == $imageName and .dockerfile == $dockerfile and .imageRef == $imageRef and .platform == "linux/amd64" and .archiveFile == "image.tar" and (.archiveSha256 | test("^[0-9a-f]{64}$")) and (.archiveBytes | type == "number" and . > 0) and .cacheScope == ("auditsphere-release-" + $imageKey) and (.prebuiltAngular | type == "boolean") and (if .prebuiltAngular then (.imageKey == "api" and (.angularBundleCiRunId | type == "number" and . > 0) and (.angularBundleCiRunAttempt | type == "number" and . > 0) and (.angularBundleArtifactId | type == "number" and . > 0)) else (.angularBundleCiRunId == null and .angularBundleCiRunAttempt == null and .angularBundleArtifactId == null) end)' \
              "$manifest" >/dev/null
            test -s "$archive"
            test "$(wc -c < "$archive" | tr -d '[:space:]')" -eq "$(jq -r .archiveBytes "$manifest")"
            expected_digest="$(jq -r .archiveSha256 "$manifest")"
            printf '%s  %s\n' "$expected_digest" "$archive" | sha256sum --check --status
            docker load --input "$archive"
            test "$(docker image inspect "$expected_image" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          done

      # OIDC stays on this protected-environment job, and the credential is requested only after
      # all three artifacts have passed their exact-run/source/hash checks.
      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Publish the three verified tags and capture registry digest pins
        id: publish
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          [[ "$ACR_NAME" =~ ^[a-z0-9]{5,50}$ ]]
          registry="$ACR_NAME.azurecr.io"
          sha="$GITHUB_SHA"
          az acr login --name "$ACR_NAME"
          push_and_pin() {
            local key="$1" image="$2"
            local push_log="$RUNNER_TEMP/${key}-push.log"
            docker push "$image" >"$push_log" 2>&1 || return 1
            local digest
            digest="$(awk '$2 == "digest:" && $3 ~ /^sha256:[0-9a-f]+$/ { value=$3 } END { print value }' "$push_log")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s\n' "$digest" > "$RUNNER_TEMP/${key}-digest.txt"
          }
          push_and_pin api "$registry/auditsphere-api:$sha" & api_pid=$!
          push_and_pin worker "$registry/auditsphere-worker:$sha" & worker_pid=$!
          push_and_pin migrations "$registry/auditsphere-migrations:$sha" & migrations_pid=$!
          push_status=0
          wait "$api_pid" || push_status=1
          wait "$worker_pid" || push_status=1
          wait "$migrations_pid" || push_status=1
          for key in api worker migrations; do
            cat "$RUNNER_TEMP/${key}-push.log"
          done
          if (( push_status != 0 )); then
            echo "At least one image push failed or omitted a valid registry digest; refusing deployment." >&2
            exit 1
          fi
          api_image="$registry/auditsphere-api@$(cat "$RUNNER_TEMP/api-digest.txt")"
          worker_image="$registry/auditsphere-worker@$(cat "$RUNNER_TEMP/worker-digest.txt")"
          migration_image="$registry/auditsphere-migrations@$(cat "$RUNNER_TEMP/migrations-digest.txt")"
          {
            echo "api_image=$api_image"
            echo "worker_image=$worker_image"
            echo "migration_image=$migration_image"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Published image identities"
            echo
            echo "- Source commit: \`$sha\`"
            echo "- API: \`$api_image\`"
            echo "- Worker: \`$worker_image\`"
            echo "- Migration: \`$migration_image\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the migration job (blocking)
        run: |
          set -euo pipefail
          job="${{ inputs.name_prefix }}-migrations"
          az containerapp job start --name "$job" \
            --resource-group "${{ inputs.azure_resource_group }}"
          # The job exits non-zero on failed migrations; poll until it terminates.
          # Keep the 15-minute wait budget while observing completion more frequently.
          for _attempt in $(seq 1 180); do
            status="$(az containerapp job execution list --name "$job" \
              --resource-group "${{ inputs.azure_resource_group }}" \
              --query '[0].properties.status' -o tsv || true)"
            case "$status" in
              Succeeded) echo "Migrations succeeded."; exit 0 ;;
              Failed|FailedStarting) echo "Migration job failed; new revision must not receive traffic."; exit 1 ;;
            esac
            sleep 5
          done
          echo "Migration job did not complete in time."; exit 1

      - name: Deploy API and worker revisions
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --template-file infra/environments/${{ inputs.environment }}/main.bicep \
            --parameters deploymentEpoch="${{ github.run_number }}" \
              apiImage="${{ steps.publish.outputs.api_image }}" \
              workerImage="${{ steps.publish.outputs.worker_image }}" \
              migrationImage="${{ steps.publish.outputs.migration_image }}" \
              registryServer="${{ inputs.acr_name }}.azurecr.io" \
              registryId="/subscriptions/${{ inputs.azure_subscription_id }}/resourceGroups/${{ inputs.azure_resource_group }}/providers/Microsoft.ContainerRegistry/registries/${{ inputs.acr_name }}"

      - name: Canary 10% of API traffic to the new revision
        run: |
          set -euo pipefail
          app="auditsphere-prod-api"
          revision="$(az containerapp revision list --name "$app" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --query '[0].name' -o tsv)"
          az containerapp ingress traffic update --name "$app" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --revision-weight "$revision=10"

      - name: Canary smoke checks (read-only)
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show --name auditsphere-prod-api \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          # Keep the 200-second readiness budget while reducing detection latency.
          for _attempt in $(seq 1 40); do
            if curl -fsS "https://$fqdn/health/live" >/dev/null; then break; fi
            sleep 5
          done
          curl -fsS "https://$fqdn/health/live" >/dev/null
          # Readiness includes database and migration-state verification.
          curl -fsS "https://$fqdn/health/ready" >/dev/null
          # Read-only Angular route smoke: the shell must render without authenticating.
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://$fqdn/ui")"
          test "$code" = 200

      - name: Promote or roll back
        run: |
          set -euo pipefail
          # Promotion and rollback are explicit operator decisions recorded in the run log:
          #   promote:   az containerapp ingress traffic update --revision-weight <new>=100
          #   rollback:  az containerapp ingress traffic update --revision-weight <previous>=100
          # Database rollback is NOT part of application rollback; migrations are forward-only
          # and the migration bundle must never be reversed through this pipeline.
          echo "Canary healthy at 10%. Promoting requires the environment approval gate above."
