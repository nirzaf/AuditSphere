name: Hostinger acceptance images

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/hostinger-acceptance-images.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AuditSphereOps.slnx'
      - 'global.json'
      - 'src/AuditSphereOps.Api/**'
      - 'src/AuditSphereOps.Application/**'
      - 'src/AuditSphereOps.Domain/**'
      - 'src/AuditSphereOps.Infrastructure/**'
      - 'src/AuditSphereOps.Ui/**'
      - 'src/AuditSphereOps.Worker/**'
      - 'infra/docker/migrations.Dockerfile'
      - 'scripts/diagnostics/image-build-memory.sh'
      - 'scripts/diagnostics/image-build-process-memory.sh'
      - 'scripts/diagnostics/image-build-counters.py'
      - 'scripts/diagnostics/image-build-counter-target.sh'
      - 'docs/task_breakdown/tracking/pack_manifest.json'
      - 'docs/task_breakdown/tasks/**'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-acceptance-images-${{ github.event_name }}-${{ github.ref }}
  # New pushes replace stale automatic image builds; explicit manual builds are retained.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build-and-push:
    name: Build and publish private linux/amd64 image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      # Keep every image build running if one image fails.
      fail-fast: false
      matrix:
        include:
          - name: API
            image: auditsphere-acceptance-api
            dockerfile: src/AuditSphereOps.Api/Dockerfile
          - name: worker
            image: auditsphere-acceptance-worker
            dockerfile: src/AuditSphereOps.Worker/Dockerfile
          - name: migrations
            image: auditsphere-acceptance-migrations
            dockerfile: infra/docker/migrations.Dockerfile
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create Buildx builder
        run: docker buildx create --name hostinger-acceptance --use

      - name: Build and push image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          bash scripts/diagnostics/image-build-memory.sh buildx_buildkit_hostinger-acceptance0 -- \
            docker buildx build --platform linux/amd64 --push \
            --cache-from "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:buildcache" \
            --cache-to "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:buildcache,mode=max" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --file "$DOCKERFILE" .

  summarize:
    name: Summarize image references
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarize image references
        run: |
          {
            printf "Source commit: \`%s\`\n\n" "$GITHUB_SHA"
            printf "Private GHCR images:\n"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-api:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-worker:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-migrations:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
