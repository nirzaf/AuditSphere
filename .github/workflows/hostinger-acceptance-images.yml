name: Hostinger acceptance images

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/hostinger-acceptance-images.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'AuditSphereOps.slnx'
      - 'global.json'
      - 'src/AuditSphereOps.Api/**'
      - 'src/AuditSphereOps.Application/**'
      - 'src/AuditSphereOps.Domain/**'
      - 'src/AuditSphereOps.Infrastructure/**'
      - 'src/AuditSphereOps.Ui/**'
      - 'src/AuditSphereOps.Worker/**'
      - 'infra/docker/migrations.Dockerfile'
      - 'scripts/diagnostics/image-build-memory.sh'
      - 'scripts/diagnostics/image-build-process-memory.sh'
      - 'scripts/diagnostics/image-build-counters.py'
      - 'scripts/diagnostics/image-build-counter-target.sh'
      - 'docs/task_breakdown/tracking/pack_manifest.json'
      - 'docs/task_breakdown/tasks/**'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-acceptance-images-${{ github.event_name }}-${{ github.ref }}
  # New pushes replace stale automatic image builds; explicit manual builds are retained.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  find-angular-bundle:
    name: Find exact-source Angular bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      run_attempt: ${{ steps.find.outputs.run_attempt }}
      artifact_id: ${{ steps.find.outputs.artifact_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact image source for artifact discovery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Find optional retained Angular artifact from successful exact-source CI
        id: find
        continue-on-error: true
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          default_branch="$(gh api "repos/${REPOSITORY}" --jq .default_branch)"
          python3 scripts/release/ci_build_artifact.py find-angular-bundle \
            --api-url https://api.github.com \
            --repository "$REPOSITORY" \
            --branch "$default_branch" \
            --source-sha "$SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and publish private linux/amd64 image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: find-angular-bundle
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      # Keep every image build running if one image fails.
      fail-fast: false
      matrix:
        include:
          - name: API
            image: auditsphere-acceptance-api
            dockerfile: src/AuditSphereOps.Api/Dockerfile
          - name: worker
            image: auditsphere-acceptance-worker
            dockerfile: src/AuditSphereOps.Worker/Dockerfile
          - name: migrations
            image: auditsphere-acceptance-migrations
            dockerfile: infra/docker/migrations.Dockerfile
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download exact-source Angular bundle when already retained
        id: download-angular
        if: ${{ matrix.name == 'API' && needs.find-angular-bundle.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: angular-ui-browser
          path: ${{ runner.temp }}/release-angular-ui
          repository: ${{ github.repository }}
          run-id: ${{ needs.find-angular-bundle.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Discard incomplete optional bundle download
        if: ${{ matrix.name == 'API' && steps.download-angular.outcome == 'failure' }}
        run: rm -rf -- "$RUNNER_TEMP/release-angular-ui"

      - name: Prepare verified Angular bundle or Dockerfile source-build fallback
        id: prepare-angular
        if: ${{ matrix.name == 'API' }}
        run: |
          set -euo pipefail
          python3 scripts/release/ci_build_artifact.py prepare-angular-context \
            --artifact-dir "$RUNNER_TEMP/release-angular-ui" \
            --context-dir "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"
          available="$(sed -n 's/^available=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [ "$available" = true ]; then
            echo "Reusing exact-source Angular artifact from CI run ${{ needs.find-angular-bundle.outputs.run_id }}." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No retained exact-source Angular artifact; using the cached Docker npm fallback." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create Buildx builder
        run: docker buildx create --name hostinger-acceptance --use

      - name: Build and push image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          USE_PREBUILT_ANGULAR: ${{ matrix.name == 'API' && steps.prepare-angular.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          bash scripts/diagnostics/image-build-memory.sh buildx_buildkit_hostinger-acceptance0 -- \
            docker buildx build --platform linux/amd64 --push \
            --cache-from "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:buildcache" \
            --cache-to "type=registry,ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:buildcache,mode=max" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --build-arg "USE_PREBUILT_ANGULAR=${USE_PREBUILT_ANGULAR}" \
            --file "$DOCKERFILE" .

  summarize:
    name: Summarize image references
    needs: build-and-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarize image references
        run: |
          {
            printf "Source commit: \`%s\`\n\n" "$GITHUB_SHA"
            printf "Private GHCR images:\n"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-api:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-worker:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
            printf -- "- \`ghcr.io/%s/auditsphere-acceptance-migrations:%s\`\n" "${GITHUB_REPOSITORY_OWNER,,}" "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
