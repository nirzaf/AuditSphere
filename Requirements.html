le keeping evidence, judgment and accountability clear.<\/tspan><\/text><\/svg>","steps":5,"note":"The requirements connect client acquisition, accounts preparation, audit work, review and controlled reporting, supported by practice finance and records. The three financial responsibilities remain separate throughout. Client sign-off should focus on scope, responsibilities, evidence, approval rules and the handovers that still need demonstration.","review":"Confirm the requirements and record any amendments before treating the workflow as agreed.","boundary":""}]</script>
<script>
'use strict';
const slides=JSON.parse(document.getElementById('deck-data').textContent);
let idx=0,step=0,following=false,previousFocus=null;
const $=id=>document.getElementById(id);
const stage=$('stage'),notes=$('notes'),contents=$('contents');
slides.forEach((s,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${String(i+1).padStart(2,'0')} · ${s.title}`;contents.appendChild(option)});
function render(sync=true){
 const s=slides[idx];stage.innerHTML=s.svg;
 stage.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('future-step',following&&Number(e.dataset.step)>step));
 $('counter').textContent=`${idx+1} / ${slides.length}`;contents.value=idx;
 $('stepStatus').textContent=following&&s.steps?`Step ${step} of ${s.steps}`:'Complete view';
 $('stepsButton').textContent=following?'Show full view':'Follow steps';$('stepsButton').setAttribute('aria-pressed',String(following));$('stepsButton').disabled=!s.steps;
 $('prevButton').disabled=idx===0&&(!following||step<=1);$('nextButton').disabled=idx===slides.length-1&&(!following||step>=s.steps);
 $('progressBar').style.width=`${100*(idx+1)/slides.length}%`;
 $('noteTitle').textContent=s.title;$('noteText').textContent=s.note;$('reviewText').textContent=s.review;$('boundaryText').textContent=s.boundary;$('boundaryBox').hidden=!s.boundary;
 document.title=s.title+' — AuditSphere';
 if(sync){const h=`#${idx+1}${following?'/'+step:''}`;try{history.replaceState(null,'',h)}catch(e){location.hash=h}}
}
function go(index){idx=Math.max(0,Math.min(slides.length-1,Number(index)||0));step=following?Math.min(1,slides[idx].steps):slides[idx].steps;render()}
function next(){if(following&&step<slides[idx].steps){step++;render()}else if(idx<slides.length-1)go(idx+1)}
function prev(){if(following&&step>1){step--;render()}else if(idx>0){idx--;step=slides[idx].steps;render()}}
function setFollowing(value){following=Boolean(value);step=following?Math.min(1,slides[idx].steps):slides[idx].steps;render()}
function openNotes(){previousFocus=document.activeElement;notes.hidden=false;notes.classList.add('open');$('shade').classList.add('open');$('notesButton').setAttribute('aria-expanded','true');$('closeNotes').focus()}
function closeNotes(){notes.hidden=true;notes.classList.remove('open');$('shade').classList.remove('open');$('notesButton').setAttribute('aria-expanded','false');if(previousFocus&&typeof previousFocus.focus==='function')previousFocus.focus()}
function toggleNotes(){notes.hidden?openNotes():closeNotes()}
function toast(message){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),4500)}
async function fullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();else toast('Use the browser’s full-screen option.')}catch(e){toast('Use the browser’s full-screen option.')}}
$('prevButton').addEventListener('click',prev);$('nextButton').addEventListener('click',next);contents.addEventListener('change',()=>go(contents.value));$('stepsButton').addEventListener('click',()=>setFollowing(!following));$('notesButton').addEventListener('click',toggleNotes);$('closeNotes').addEventListener('click',closeNotes);$('shade').addEventListener('click',closeNotes);$('fullscreenButton').addEventListener('click',fullscreen);
document.addEventListener('keydown',e=>{
 if(!notes.hidden){if(e.key==='Escape'||e.key.toLowerCase()==='n'){e.preventDefault();closeNotes()}else if(e.key==='Tab'){e.preventDefault();$('closeNotes').focus()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;
 if(e.key===' '&&e.target.tagName==='BUTTON')return;
 if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='PageDown'){e.preventDefault();go(idx+1)}
 else if(e.key==='PageUp'){e.preventDefault();go(idx-1)}
 else if(e.key==='Home'){e.preventDefault();go(0)}
 else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
 else if(e.key.toLowerCase()==='s')setFollowing(!following);
 else if(e.key.toLowerCase()==='a')setFollowing(false);
 else if(e.key.toLowerCase()==='n')openNotes();
 else if(e.key.toLowerCase()==='f')fullscreen();
});
function fromHash(){const m=location.hash.match(/^#(\d+)(?:\/(\d+))?$/);if(!m)return;idx=Math.max(0,Math.min(slides.length-1,Number(m[1])-1));following=Boolean(m[2]);step=following?Math.max(0,Math.min(slides[idx].steps,Number(m[2]))):slides[idx].steps;render(false)}
window.addEventListener('hashchange',fromHash);
// Exposed for presentation navigation and local quality checks; no network access is used.
window.auditDeck={slides,go,next,prev,showAll:()=>setFollowing(false),follow:()=>setFollowing(true),get index(){return idx},get step(){return step},get following(){return following}};
$('print').innerHTML=slides.map(s=>'<section class="print-slide">'+s.svg+'</section>').join('');
if(/^#\d+(?:\/\d+)?$/.test(location.hash))fromHash();else{step=slides[0].steps;render()}
</script>
